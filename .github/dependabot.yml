version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Stay on TypeScript 6 until TS 7 is supported by typescript-eslint,
      # vue-tsc and vite-plugin-dts.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
