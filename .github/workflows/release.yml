name: Release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No dependency cache in the publishing job: a poisoned cache entry would
      # run with the OIDC publish credential.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Tag must match package.json version
        run: |
          EXPECTED="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $EXPECTED"
            exit 1
          fi

      # Trusted publishing needs npm >= 11.5.1. Use the npm bundled with the
      # Node release above instead of installing an unpinned npm@latest.
      - name: Bundled npm supports trusted publishing
        run: |
          NPM_VERSION="$(npm --version)"
          echo "npm $NPM_VERSION"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number)
            const ok = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)))
            if (!ok) { console.error("::error::npm " + process.argv[1] + " is older than 11.5.1"); process.exit(1) }
          ' "$NPM_VERSION"

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Lint package (publint, attw)
        run: npm run lint:package

      - name: Check if version is already published
        id: version-check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          PUBLISHED_VERSION=""
          if PUBLISHED_VERSION=$(npm view "$NAME@$VERSION" version 2>/dev/null); then :; fi
          if [ -n "$PUBLISHED_VERSION" ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.version-check.outputs.published == 'false'
        run: npm publish --provenance
